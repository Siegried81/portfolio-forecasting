name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        # torch first, from PyTorch's CPU index: the suite only ever runs the
        # small CPU LSTM, and the default PyPI wheel drags several GB of CUDA
        # packages onto the runner (see the note in requirements.txt). With the
        # CPU build already present, `pip install -r requirements.txt` sees its
        # `torch>=2.0,<3.0` satisfied and skips the download.
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements.txt
          pip install mypy

      - name: Run tests
        run: pytest -v

      - name: Type check (strict, blocking)
        run: mypy --ignore-missing-imports --strict src/

      - name: Capacity benchmark smoke check (non-blocking)
        continue-on-error: true
        run: python scripts/benchmark_walk_forward.py --quick