services:
  portfolio-forecasting:
    build:
      context: .
      dockerfile: Dockerfile
    # build + image: `docker compose up --build` builds from source and tags it with the
    # Docker Hub name; `docker compose pull` downloads the published image instead.
    image: ${DOCKERHUB_USERNAME:-siegried}/portfolio-forecasting:latest
    container_name: portfolio-forecasting
    ports:
      # Host port: each app has its own, so all of them can run at once.
      # Override with UI_PORT in .env; the app still listens on 8501 inside.
      - "${UI_PORT:-8504}:8501"
    env_file:
      # Optional: every key is optional (see README), so a missing .env must not stop the stack.
      - path: .env
        required: false
    environment:
      STREAMLIT_SERVER_HEADLESS: "true"
      STREAMLIT_SERVER_ADDRESS: "0.0.0.0"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    # depends_on:
    #   - redis
  redis:
    image: redis:7-alpine
    profiles: ["with-redis"]
    ports:
      # 127.0.0.1 only: Redis has no password here, it must not be reachable from the network.
      - "127.0.0.1:6379:6379"
    restart: unless-stopped